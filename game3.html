<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кибер.Рыцарь — Этап 3: Сапёр</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue:       #1A55E3;
      --blue-soft:  #E5EDFF;
      --green:      #6EE04A;
      --magenta:    #FF3B6B;
      --dark:       #0a0a1e;
      --text:       #0D1B4B;
      --text-muted: #6B7280;
      --bg:         #F0F4FF;
      --surface:    #FFFFFF;
      --radius-md:  14px;
      --radius-lg:  20px;
      --transition: 220ms ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .phone {
      width: 320px;
      border-radius: 44px;
      border: 8px solid #0d0d1a;
      overflow: hidden;
      background: #0d0d1a;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    }

    .screen {
      width: 100%;
      height: 660px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ─── HUD ─── */
    .hud {
      background: var(--blue);
      padding: 16px 18px 13px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hud-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hud-c  { position: relative; z-index: 2; }
    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .hud-title { font-size: 13px; font-weight: 900; color: #fff; }
    .found-pill {
      background: rgba(110,224,74,.2);
      border: 1px solid rgba(110,224,74,.4);
      color: var(--green);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
    }
    .progress-bar { background: rgba(255,255,255,.2); border-radius: 4px; height: 4px; overflow: hidden; }
    .progress-fill {
      height: 4px; border-radius: 4px;
      background: var(--green);
      width: 0%;
      transition: width 400ms ease;
    }
    .hud-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }
    .hud-label  { font-size: 10px; color: rgba(255,255,255,.55); font-weight: 700; letter-spacing: .06em; }
    .error-disp { font-size: 10px; font-weight: 700; color: var(--magenta); }

    /* ─── INSTRUCTION ─── */
    .instruction {
      background: var(--surface);
      border-bottom: 1px solid rgba(26,85,227,.08);
      padding: 9px 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .instruction-text { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
    .instruction-text b { color: var(--text); }

    /* ─── DESKTOP MOCKUP ─── */
    .desktop {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }
    .desktop-bar {
      background: var(--surface);
      border-radius: 10px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .desktop-time { font-size: 11px; font-weight: 700; color: var(--text); }
    .desktop-icons-top { display: flex; gap: 6px; }
    .desktop-icon-sm {
      width: 18px; height: 18px;
      border-radius: 5px;
      background: var(--blue-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
    }

    /* ─── APP GRID ─── */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      align-content: start;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
    }

    .app-icon {
      width: 58px; height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 200ms;
      border: 2px solid transparent;
    }
    .app-icon.danger-found {
      border-color: var(--green);
      background: #E4FBD9 !important;
    }
    .app-icon.safe-wrong { animation: shake .3s ease; }
    .app-icon.exploded {
      opacity: 0;
      transform: scale(0);
      pointer-events: none;
      transition: all 300ms;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-5px); }
      75%      { transform: translateX(5px); }
    }

    .app-name {
      font-size: 8px;
      color: var(--text);
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
      max-width: 58px;
    }

    .app-check {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      opacity: 0;
      transition: opacity 200ms;
    }
    .app-check.show { opacity: 1; }

    /* ─── TOOLTIP ─── */
    .tooltip {
      position: absolute;
      left: 14px; right: 14px; bottom: 12px;
      background: var(--text);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      z-index: 20;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
      transform: translateY(6px);
      opacity: 0;
      transition: all 220ms ease;
      pointer-events: none;
    }
    .tooltip.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .tooltip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .tooltip-tag { font-size: 10px; font-weight: 700; letter-spacing: .07em; }
    .tooltip-tag.correct { color: var(--green); }
    .tooltip-tag.wrong   { color: var(--magenta); }
    .tooltip-close {
      background: rgba(255,255,255,.12);
      border: none; color: #fff;
      border-radius: 6px;
      width: 20px; height: 20px;
      cursor: pointer; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit;
    }
    .tooltip-close:hover { background: rgba(255,255,255,.2); }
    .tooltip-title { font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .tooltip-body  { font-size: 11px; color: rgba(255,255,255,.6); line-height: 1.45; }

    /* ─── END SCREEN ─── */
    .end-screen {
      position: absolute;
      inset: 0;
      background: var(--dark);
      z-index: 40;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
    }
    .end-screen.show { display: flex; }
    .end-score { font-size: 56px; font-weight: 900; color: var(--green); letter-spacing: -2px; margin-bottom: 4px; }
    .end-label { font-size: 12px; color: rgba(255,255,255,.4); margin-bottom: 22px; }
    .end-title { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 8px; }
    .end-sub   { font-size: 12px; color: rgba(255,255,255,.5); line-height: 1.5; margin-bottom: 28px; }
    .btn-end {
      background: var(--green);
      color: #1a4a00;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
      transition: opacity var(--transition);
    }
    .btn-end:active { opacity: 0.85; }
  </style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <!-- HUD -->
    <div class="hud">
      <svg class="hud-bg" viewBox="0 0 320 80" fill="none" preserveAspectRatio="xMidYMid slice">
        <line x1="0" y1="28" x2="320" y2="28" stroke="#fff" stroke-width=".4" opacity=".08" stroke-dasharray="3 5"/>
        <line x1="0" y1="65" x2="320" y2="65" stroke="#6EE04A" stroke-width=".4" opacity=".12" stroke-dasharray="3 5"/>
        <polygon points="270,5 292,5 292,24 270,24" stroke="#6EE04A" stroke-width="1" fill="none" opacity=".25"/>
      </svg>
      <div class="hud-c">
        <div class="hud-row">
          <div class="hud-title">💣 Сапёр</div>
          <div class="found-pill" id="foundPill">💣 0 / 5</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="hud-sub">
          <div class="hud-label">ЭТАП 3 / 4</div>
          <div class="error-disp" id="errorDisp">Ошибок: 0</div>
        </div>
      </div>
    </div>

    <!-- Instruction -->
    <div class="instruction">
      <div class="instruction-text">Найди все <b>вредоносные приложения</b> — тапни на каждое</div>
    </div>

    <!-- Desktop mockup -->
    <div class="desktop">
      <div class="desktop-bar">
        <div class="desktop-time">📱 Мой телефон</div>
        <div class="desktop-icons-top">
          <div class="desktop-icon-sm">📶</div>
          <div class="desktop-icon-sm">🔋</div>
        </div>
      </div>
      <div class="app-grid" id="appGrid"></div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
      <div class="tooltip-header">
        <div class="tooltip-tag" id="tooltipTag"></div>
        <button class="tooltip-close" onclick="closeTooltip()">✕</button>
      </div>
      <div class="tooltip-title" id="tooltipTitle"></div>
      <div class="tooltip-body"  id="tooltipBody"></div>
    </div>

    <!-- End screen -->
    <div class="end-screen" id="endScreen">
      <div class="end-score" id="endScore">+0</div>
      <div class="end-label">очков заработано</div>
      <div class="end-title" id="endTitle"></div>
      <div class="end-sub"   id="endSub"></div>
      <!--
        В реальном приложении:
        gameState.totalScore += score;
        showScreen('stage-result');
      -->
      <button class="btn-end" onclick="alert('→ onComplete(score) в app.js')">Далее →</button>
    </div>

  </div>
</div>

<script>
  /* ─────────────────────────────────────
     ДАННЫЕ ПРИЛОЖЕНИЙ
     danger: true  → вредоносное (тап = правильно)
     danger: false → безопасное  (тап = ошибка)
  ───────────────────────────────────── */
  const apps = [
    { name: 'Ozon',         icon: '🛍️', bg: '#E5EDFF', danger: false },
    { name: 'FastCleaner',  icon: '⚡',  bg: '#FEF3C7', danger: true,
      title: '«Очистители» — замаскированные трояны',
      body:  'Приложения-«очистители» почти всегда содержат шпионский код и запрашивают доступ ко всему телефону.' },
    { name: 'ВКонтакте',    icon: '💙', bg: '#DBEAFE', danger: false },
    { name: 'Telegram',     icon: '✈️', bg: '#E0F2FE', danger: false },
    { name: 'SpyTracker',   icon: '👁️', bg: '#F3E8FF', danger: true,
      title: 'SpyTracker — шпионская программа',
      body:  'Название буквально говорит о слежке. Любое приложение с «Spy», «Track», «Monitor» в названии — красный флаг.' },
    { name: 'Камера',       icon: '📷', bg: '#F1F5F9', danger: false },
    { name: 'Карты',        icon: '🗺️', bg: '#DCFCE7', danger: false },
    { name: 'BankHelper',   icon: '💳', bg: '#FEF9C3', danger: true,
      title: 'Поддельный «банковский помощник»',
      body:  'Нет официального приложения с таким названием. Банковские приложения устанавливай только из официальных магазинов.' },
    { name: 'Музыка',       icon: '🎵', bg: '#FFE4E6', danger: false },
    { name: 'Заметки',      icon: '📝', bg: '#FEF3C7', danger: false },
    { name: 'FreeVPN Pro',  icon: '🔓', bg: '#E0E7FF', danger: true,
      title: 'Бесплатный VPN — классическая ловушка',
      body:  'Бесплатные VPN зарабатывают на твоих данных: перехватывают трафик и читают незашифрованные данные.' },
    { name: 'Погода',       icon: '⛅', bg: '#E0F2FE', danger: false },
    { name: 'RootAccess',   icon: '🔧', bg: '#FEE2E2', danger: true,
      title: 'RootAccess — получает полный контроль',
      body:  'Приложения с «Root» в названии пытаются получить системный доступ: читать SMS, перехватывать пароли.' },
    { name: 'Калькулятор',  icon: '🔢', bg: '#EDE9FE', danger: false },
    { name: 'YouTube',      icon: '▶️', bg: '#FEE2E2', danger: false },
    { name: 'Контакты',     icon: '👥', bg: '#DBEAFE', danger: false },
  ];

  const TOTAL_DANGER = apps.filter(a => a.danger).length; // 5
  let found  = 0;
  let errors = 0;
  let score  = 0;
  let tooltipTimer = null;

  /* ─── SHUFFLE ─── */
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ─── BUILD GRID ─── */
  function buildGrid() {
    const grid = document.getElementById('appGrid');
    shuffle(apps).forEach((app, i) => {
      const el = document.createElement('div');
      el.className = 'app';
      el.innerHTML = `
        <div class="app-icon" id="icon-${i}" style="background:${app.bg}">
          <span style="font-size:26px">${app.icon}</span>
          <div class="app-check" id="check-${i}">✓</div>
        </div>
        <div class="app-name">${app.name}</div>`;
      el.addEventListener('click', () => handleTap(app, i));
      grid.appendChild(el);
    });
  }

  /* ─── TAP HANDLER ─── */
  function handleTap(app, i) {
    const icon = document.getElementById('icon-' + i);
    if (icon.classList.contains('danger-found') || icon.classList.contains('exploded')) return;

    if (app.danger) {
      found++;
      score += 150;
      icon.classList.add('danger-found');
      document.getElementById('check-' + i).classList.add('show');
      updateHUD();
      showTooltip(true, app.title, app.body);
      if (found >= TOTAL_DANGER) setTimeout(endGame, 900);
    } else {
      errors++;
      score = Math.max(0, score - 40);
      icon.classList.add('safe-wrong');
      showTooltip(false,
        'Это обычное приложение',
        'Ты отметил безопасное приложение как вредоносное. Смотри на название — признаки опасных: Spy, Root, Free VPN, неизвестные «банковские помощники».'
      );
      setTimeout(() => {
        icon.classList.remove('safe-wrong');
        icon.classList.add('exploded');
      }, 400);
      updateHUD();
    }
  }

  /* ─── HUD ─── */
  function updateHUD() {
    document.getElementById('foundPill').textContent    = '💣 ' + found + ' / ' + TOTAL_DANGER;
    document.getElementById('progressFill').style.width = (found / TOTAL_DANGER * 100) + '%';
    document.getElementById('errorDisp').textContent    = 'Ошибок: ' + errors;
  }

  /* ─── TOOLTIP ─── */
  function showTooltip(correct, title, body) {
    const tt  = document.getElementById('tooltip');
    const tag = document.getElementById('tooltipTag');
    tag.textContent = correct ? '✓ ОБЕЗВРЕЖЕНО' : '✗ ОШИБКА';
    tag.className   = 'tooltip-tag ' + (correct ? 'correct' : 'wrong');
    document.getElementById('tooltipTitle').textContent = title;
    document.getElementById('tooltipBody').textContent  = body;
    tt.classList.add('show');
    clearTimeout(tooltipTimer);
    tooltipTimer = setTimeout(closeTooltip, 4200);
  }

  function closeTooltip() {
    document.getElementById('tooltip').classList.remove('show');
  }

  /* ─── END GAME ─── */
  function endGame() {
    closeTooltip();
    const es = document.getElementById('endScreen');
    document.getElementById('endScore').textContent = '+' + score;

    if (errors === 0) {
      document.getElementById('endTitle').textContent = '🛡️ Щит получен! Идеально!';
      document.getElementById('endSub').textContent   = 'Ты нашёл все вредоносные приложения без единой ошибки. Настоящий сапёр.';
    } else {
      document.getElementById('endTitle').textContent = '🛡️ Щит «Лимиты на траты» получен';
      document.getElementById('endSub').textContent   = 'Ошибок: ' + errors + '. Запомни признаки: Spy, Root, Free VPN, поддельные банковские приложения.';
    }

    es.classList.add('show');
  }

  /* ─── INIT ─── */
  buildGrid();
</script>

</body>
</html>
